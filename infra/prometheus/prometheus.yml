# Autograde AI — Prometheus scrape config (dev).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics arrive via the OpenTelemetry Collector's Prometheus
  # exporter. Every LLM call, grader latency, and workflow span surfaces here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Redpanda exposes Prometheus metrics on its admin port.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
