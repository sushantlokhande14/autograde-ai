# Autograde AI — Grafana dashboard provider (dev).
apiVersion: 1

providers:
  - name: autograde
    orgId: 1
    folder: Autograde AI
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
