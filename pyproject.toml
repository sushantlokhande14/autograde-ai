[project]
name = "autograde-ai"
version = "0.0.0"
description = "Autograde AI — a local-first, agent-orchestrated grading platform for CS coursework."
requires-python = ">=3.11"
dependencies = [
    "autograde-core",
    "autograde-db",
    "autograde-llm",
    "autograde-rag",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "confluent-kafka>=2.5",
    "pymupdf>=1.24",
    "nbformat>=5.10",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "pytesseract>=0.3.13",
    "Pillow>=10.4",
    "python-docx>=1.1",
    "matplotlib>=3.9",
    "reportlab>=4.2",
    "temporalio>=1.7",
    "sympy>=1.13",
    "ruff>=0.7",
    "strawberry-graphql[fastapi]>=0.246",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "grpcio-tools>=1.67",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The root package owns the `services` namespace; shared libs are workspace
# members installed as their own distributions.
[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
autograde-core = { workspace = true }
autograde-db = { workspace = true }
autograde-llm = { workspace = true }
autograde-rag = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
