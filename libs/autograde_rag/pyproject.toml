[project]
name = "autograde-rag"
version = "0.0.0"
description = "Chunking, embedding, indexing, and retrieval for Autograde AI."
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12",
    "redis>=5.0",
    "sentence-transformers>=3.2",
    "autograde-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autograde_rag"]

[tool.uv.sources]
autograde-core = { workspace = true }
