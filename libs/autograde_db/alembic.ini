# Alembic config for autograde_db. Run from libs/autograde_db:
#   uv run alembic upgrade head
# The database URL is injected from application settings in migrations/env.py.
[alembic]
# %(here)s resolves relative to this ini file, so alembic can run from the repo
# root (where .env lives) via: uv run alembic -c libs/autograde_db/alembic.ini ...
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
