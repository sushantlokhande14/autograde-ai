[project]
name = "autograde-db"
version = "0.0.0"
description = "SQLAlchemy models and migrations for Autograde AI."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "autograde-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autograde_db"]

[tool.uv.sources]
autograde-core = { workspace = true }
