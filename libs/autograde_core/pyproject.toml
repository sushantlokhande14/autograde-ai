[project]
name = "autograde-core"
version = "0.0.0"
description = "Shared config, health, service registry, and telemetry for Autograde AI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "grpcio>=1.67",
    "minio>=7.2",
    "confluent-kafka>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autograde_core"]
