[project]
name = "autograde-llm"
version = "0.0.0"
description = "Unified local + hosted LLM client for Autograde AI."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "ollama>=0.3",
    "redis>=5.0",
    "autograde-core",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.54"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autograde_llm"]

[tool.uv.sources]
autograde-core = { workspace = true }
